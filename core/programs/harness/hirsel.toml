[package]
name = "harness"
major = 1
charge = "charge-v1"

[dependencies]
std = { major = 1 }
mcp = { major = 1, path = "../mcp" }
store = { major = 1, path = "../store" }

[sources]
"harness.hirsel" = "harness"
"mcp.hirsel" = "mcp_tools"
"provider.hirsel" = "provider"
"gateway.hirsel" = "gateway"
"gateway_http.hirsel" = "gateway_http"

[tests]
limit = 268435456
grants = ["Clock", "Random", "Tasks", "Net=Listen 127.0.0.0/8 0-65535;Connect 127.0.0.0/8 0-65535"]
dirs = ["."]

[tests.sources]
"laws.hirsel" = "laws"
"provider_laws.hirsel" = "provider_laws"
"gateway_laws.hirsel" = "gateway_laws"
