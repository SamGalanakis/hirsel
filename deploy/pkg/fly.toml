app = "hirsel-pkg"
primary_region = "fra"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "10s"
grace_period = "45s"
method = "GET"
path = "/log/checkpoint"

[[mounts]]
source = "registry_projection"
destination = "/data"

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"
