[package]
name = "hirsel.ai/video_transcode"
version = "1.0.0"
charge = "charge-v1"

[dependencies]
std = { major = 1 }
av1 = { package = "hirsel.ai/av1", major = 1, path = "../av1" }
h264 = { package = "hirsel.ai/h264", major = 1, path = "../h264" }
media_bits = { package = "media_bits", major = 1, path = "../media_bits" }
media_container = { package = "media_container", major = 1, path = "../media_container" }
