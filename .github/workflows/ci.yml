name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Enable pinned npm
        run: corepack enable
      - name: Install web dependencies
        working-directory: app
        run: npm ci
      - name: Run static checks
        run: bash scripts/check-static.sh

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo build --workspace
      - run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Enable pinned npm
        run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check Android-related paths
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            android:
              - 'android/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/hirsel-client-*/**'
              - 'crates/hirsel-proto/**'
              - '.github/workflows/ci.yml'

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS

      - name: Set up Android SDK
        if: steps.changes.outputs.android == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK packages
        if: steps.changes.outputs.android == 'true'
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        if: steps.changes.outputs.android == 'true'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Rust builds
        if: steps.changes.outputs.android == 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - name: Install cargo-ndk
        if: steps.changes.outputs.android == 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Write placeholder Firebase configuration
        if: steps.changes.outputs.android == 'true'
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "hirsel-ci"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "dev.hirsel.android"
                }
              },
              "api_key": [{"current_key": "ci-placeholder-not-a-real-api-key"}]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build Android native libraries and Kotlin bindings from source
        if: steps.changes.outputs.android == 'true'
        run: bash android/build-native.sh

      - name: Build debug APK
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: ./gradlew assembleDebug
