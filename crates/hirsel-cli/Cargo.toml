[package]
name = "hirsel-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
native-tsan = ["hirsel-driver/native-tsan"]

[[bin]]
name = "hirsel"
path = "src/main.rs"
test = true

[dependencies]
hirsel-engine-store = { path = "../hirsel-engine-store" }
hirsel-query-products = { path = "../hirsel-query-products" }
hirsel-engine-runtime = { path = "../hirsel-engine-runtime" }
hirsel-engine-admission = { path = "../hirsel-engine-admission" }
hirsel-host-io = { path = "../hirsel-host-io" }
hirsel-compiler-identity = { path = "../hirsel-compiler-identity" }
hirsel-front-phases = { path = "../hirsel-front-phases" }
hirsel-native = { path = "../hirsel-native" }
hirsel-candidate = { path = "../hirsel-candidate" }
hirsel-project-info = { path = "../hirsel-project-info" }
hirsel-observation-view = { path = "../hirsel-observation-view" }
hirsel-guard = { path = "../hirsel-guard" }
hirsel-cli-args = { path = "../hirsel-cli-args" }
hirsel-diag = { path = "../hirsel-diag" }
hirsel-driver = { path = "../hirsel-driver" }
hirsel-engine = { path = "../hirsel-engine" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-run-config = { path = "../hirsel-run-config" }
hirsel-run-schema = { path = "../hirsel-run-schema" }

libc = { version = "0.2", default-features = false }
mimalloc = { version = "=0.1.52", default-features = false }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
hirsel-requests = { path = "../hirsel-requests" }
hirsel-native-queries = { path = "../hirsel-native-queries" }
hirsel-native-testing = { path = "../hirsel-native-testing" }
hirsel-interp = { path = "../hirsel-interp" }
tempfile = "3"
hirsel-free = { path = "../hirsel-free" }
hirsel-rt = { path = "../hirsel-rt" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
