name: Mac CI
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 */6 * * *'
    - cron: '30 3 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      control:
        description: Manual negative control
        type: choice
        default: none
        options: [none, linux-platform, unexplained-skip]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan Mac CI
    runs-on: ubuntu-24.04
    outputs:
      control: ${{ steps.plan.outputs.control }}
      cross_reason: ${{ steps.plan.outputs.cross_reason }}
      mac_reason: ${{ steps.plan.outputs.mac_reason }}
      mac_driver_inputs_reason: ${{ steps.plan.outputs.mac_driver_inputs_reason }}
      mac_driver_reason: ${{ steps.plan.outputs.mac_driver_reason }}
      nightly_cross_reason: ${{ steps.plan.outputs.nightly_reason }}
      nightly_native_reason: ${{ steps.plan.outputs.nightly_reason }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.schedule == '30 3 * * *' }}
        with:
          persist-credentials: false
      - name: Record planned exclusions
        id: plan
        env:
          CONTROL: ${{ inputs.control || 'none' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "control=$CONTROL"
            case "$CONTROL" in
              linux-platform)
                echo 'cross_reason=The platform negative control needs no image artifacts.'
                echo 'mac_driver_inputs_reason=The platform negative control needs no driver fixtures.'
                echo 'mac_driver_reason=The platform negative control exercises the Mac laws job.'
                ;;
              unexplained-skip)
                echo 'mac_reason=The aggregator negative control skips the Linux image build.'
                echo 'mac_driver_inputs_reason=The aggregator negative control needs no driver fixtures.'
                ;;
            esac
            if [[ "$SCHEDULE" == '30 3 * * *' ]]; then
              echo 'cross_reason=Mac laws run separately from the nightly corpus comparison.'
              echo 'mac_reason=Mac laws run separately from the nightly corpus comparison.'
              rustup toolchain install --no-self-update
              cargo fetch --locked
              dist_help=$(tools/toolchain-dist/build --help)
              if ! grep -Eq -- '(^|[[:space:]])--host([=[:space:]]|$)' <<< "$dist_help"; then
                echo 'nightly_reason=Waiting for R4: toolchain-dist/build --host aarch64-apple-darwin.'
              fi
            else
              echo 'nightly_reason=Cross/native comparison runs only on the nightly schedule.'
            fi
          } >> "$GITHUB_OUTPUT"

  cross:
    name: Cross-build Linux artifacts
    needs: plan
    if: ${{ needs.plan.outputs.cross_reason == '' && needs.plan.outputs.control != 'unexplained-skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned build tools
        run: |
          rustup toolchain install --no-self-update
          cargo fetch --locked
          python3 tools/buck2/prepare.py --local
      - name: Cross-build the Mach-O law images
        run: python3 tools/ci/mac_images.py export "$RUNNER_TEMP/mac-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-mac-images
          path: ${{ runner.temp }}/mac-artifacts
          if-no-files-found: error
          retention-days: 3

  mac:
    name: Run Mac laws
    needs: [plan, cross]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mac_reason == '' }}
    runs-on: ${{ needs.plan.outputs.control == 'linux-platform' && 'ubuntu-24.04' || 'macos-26' }}
    timeout-minutes: 30
    outputs:
      platform: ${{ steps.platform.outcome }}
      download: ${{ steps.download.outcome }}
      digests: ${{ steps.digests.outcome }}
      keychain: ${{ steps.keychain.outcome }}
      images: ${{ steps.images.outcome }}
      images_failures: ${{ steps.images.outputs.failures }}
      build: ${{ steps.build.outcome }}
      laws: ${{ steps.laws.outcome }}
      laws_failures: ${{ steps.laws.outputs.failures }}
      hygiene: ${{ steps.hygiene.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert arm64 macOS 26
        id: platform
        run: tools/ci/mac_assert.sh
      - uses: actions/download-artifact@v4
        id: download
        if: ${{ needs.cross.result == 'success' }}
        with:
          name: linux-mac-images
          path: ${{ runner.temp }}/mac-artifacts
      - name: Verify Linux-image digests
        id: digests
        if: ${{ needs.cross.result == 'success' }}
        run: tools/ci/mac_scrub.sh python3 tools/ci/mac_images.py verify "$RUNNER_TEMP/mac-artifacts"
      - name: Bootstrap a throwaway keychain
        id: keychain
        run: tools/ci/mac_keychain.sh
      - name: Run the Linux-built Mach-O laws with the SDK environment scrubbed
        id: images
        if: ${{ needs.cross.result == 'success' }}
        run: tools/ci/mac_scrub.sh python3 tools/ci/mac_images.py run "$RUNNER_TEMP/mac-artifacts"
      - name: Build the host test binaries and independent C compiler fixture
        id: build
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && steps.digests.outcome == 'success' }}
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/tools/buck2/toolchains/llvm-files/lib
        run: |
          apple=$(python3 tools/buck2/apple_records.py macos deployment_env floor)
          read -r deployment_env floor <<< "$apple"
          export "$deployment_env=$floor"
          rustup toolchain install --no-self-update
          cargo fetch --locked
          python3 tools/buck2/bootstrap_llvm.py
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          clang=$(xcrun --sdk macosx --find clang)
          printf '#!/bin/bash\nexec %q -isysroot %q "$@"\n' "$clang" "$sdk" > "$RUNNER_TEMP/fixture-cc"
          chmod +x "$RUNNER_TEMP/fixture-cc"
          python3 tools/ci/mac_native.py build "$RUNNER_TEMP/native-tests.json"
      - name: Run the native Darwin backend laws
        id: laws
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CC: ${{ runner.temp }}/fixture-cc
          LLVM_SYS_231_PREFIX: ${{ github.workspace }}/tools/buck2/toolchains/llvm-files
          HIRSEL_CORE_RT_ARCHIVE: ${{ runner.temp }}/mac-artifacts/libcore_cranelift_fixture.a
        run: tools/ci/mac_scrub.sh python3 tools/ci/mac_native.py run "$RUNNER_TEMP/native-tests.json"
      - name: Remove temporary credentials and check tracked files
        id: hygiene
        if: ${{ always() && steps.platform.outcome == 'success' }}
        run: |
          keychain="$RUNNER_TEMP/hirsel-ci.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          git diff --exit-code

  mac_driver_inputs:
    name: Cross-build Mac driver fixtures
    needs: plan
    if: ${{ needs.plan.outputs.mac_driver_inputs_reason == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned build tools
        run: |
          rustup toolchain install --no-self-update
          cargo fetch --locked
          python3 tools/buck2/prepare.py --local
      - name: Export the Darwin link kit and driver runtime archives
        run: python3 tools/ci/mac_native.py export-driver-inputs "$RUNNER_TEMP/driver-inputs"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-driver-inputs
          path: ${{ runner.temp }}/driver-inputs
          if-no-files-found: error
          retention-days: 3

  mac_driver:
    name: Run native Mac driver unittests
    needs: [plan, mac_driver_inputs]
    if: ${{ needs.plan.outputs.mac_driver_reason == '' && needs.plan.outputs.control != 'unexplained-skip' }}
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      tests: ${{ steps.driver_tests.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert arm64 macOS 26
        id: driver_platform
        run: tools/ci/mac_assert.sh
      - uses: actions/download-artifact@v4
        with:
          name: mac-driver-inputs
          path: ${{ runner.temp }}/driver-inputs
      - name: Bootstrap a throwaway keychain
        run: tools/ci/mac_keychain.sh
      - name: Build the checked driver and its unittest harness
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/tools/buck2/toolchains/llvm-files/lib
        run: |
          apple=$(python3 tools/buck2/apple_records.py macos deployment_env floor)
          read -r deployment_env floor <<< "$apple"
          export "$deployment_env=$floor"
          rustup toolchain install --no-self-update
          cargo fetch --locked
          python3 tools/buck2/bootstrap_llvm.py
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          clang=$(xcrun --sdk macosx --find clang)
          printf '#!/bin/bash\nexec %q -isysroot %q "$@"\n' "$clang" "$sdk" > "$RUNNER_TEMP/fixture-cc"
          chmod +x "$RUNNER_TEMP/fixture-cc"
          python3 tools/ci/mac_native.py build-driver "$RUNNER_TEMP/driver-binaries.json"
          # Some driver laws invoke the pinned clang directly for their C files.
          printf -- '-isysroot\n"%s"\n' "$sdk" > tools/buck2/toolchains/llvm-files/bin/clang.cfg
      - name: Run each default driver case with the SDK environment scrubbed
        id: driver_tests
        env:
          CC: ${{ runner.temp }}/fixture-cc
          LLVM_SYS_231_PREFIX: ${{ github.workspace }}/tools/buck2/toolchains/llvm-files
        run: |
          ulimit -n 65536
          tools/ci/mac_scrub.sh python3 tools/ci/mac_native.py run-driver \
            "$RUNNER_TEMP/driver-binaries.json" "$RUNNER_TEMP/driver-inputs"
      - name: Remove temporary credentials and check tracked files
        if: ${{ always() && steps.driver_platform.outcome == 'success' }}
        run: |
          keychain="$RUNNER_TEMP/hirsel-ci.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          git diff --exit-code

  nightly_cross:
    name: Build the nightly corpus on Linux
    needs: plan
    if: ${{ github.event_name == 'schedule' && needs.plan.outputs.nightly_cross_reason == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the Linux toolchain
        env:
          RELEASE_TAG: v0.0.0-nightly
        run: |
          rustup toolchain install --no-self-update
          cargo fetch --locked
          tools/toolchain-dist/build --local --num-threads 4 --output "$RUNNER_TEMP/prefix"
      - name: Build the Linux-to-Darwin corpus
        run: tools/ci/side.sh "$RUNNER_TEMP/prefix/hirsel" "$RUNNER_TEMP/linux-corpus"
      - name: Export the Darwin runtime archives
        run: |
          python3 tools/toolchain-dist/product.py export-runtimes aarch64-apple-darwin \
            "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/darwin-runtime-archives"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-nightly-corpus
          path: ${{ runner.temp }}/linux-corpus
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-darwin-runtime-archives
          path: ${{ runner.temp }}/darwin-runtime-archives
          if-no-files-found: error
          retention-days: 3

  nightly_native:
    name: Compare the nightly Mac corpus with Linux
    needs: [plan, nightly_cross]
    if: ${{ github.event_name == 'schedule' && needs.plan.outputs.nightly_native_reason == '' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert arm64 macOS 26
        run: tools/ci/mac_assert.sh
      - uses: actions/download-artifact@v4
        with:
          name: linux-nightly-corpus
          path: ${{ runner.temp }}/linux-corpus
      - uses: actions/download-artifact@v4
        with:
          name: nightly-darwin-runtime-archives
          path: ${{ runner.temp }}/darwin-runtime-archives
      - name: Build the native toolchain
        env:
          RELEASE_TAG: v0.0.0-nightly
        run: |
          rustup toolchain install --no-self-update
          cargo fetch --locked
          tools/toolchain-dist/build --host aarch64-apple-darwin \
            --runtime-archives "$RUNNER_TEMP/darwin-runtime-archives" --output "$RUNNER_TEMP/prefix"
      - name: Compare cross-built and native Mach-O files
        run: |
          tools/ci/mac_scrub.sh tools/ci/side.sh "$RUNNER_TEMP/prefix/hirsel" "$RUNNER_TEMP/mac-corpus"
          python3 tools/ci/compare.py "$RUNNER_TEMP/linux-corpus" "$RUNNER_TEMP/mac-corpus"

  ios_inputs:
    name: Build Apple embed packages on Linux
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.control || 'none') == 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned build tools
        run: |
          rustup toolchain install --no-self-update
          cargo fetch --locked
          python3 tools/buck2/prepare.py --local
      - name: Generate Swift packages and symbol reference objects
        run: python3 tools/ci/ios_gate/export.py "$RUNNER_TEMP/ios-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-gate-inputs
          path: ${{ runner.temp }}/ios-artifacts
          if-no-files-found: error
          retention-days: 3

  ios_simulator:
    name: Qualify Swift embed on iOS simulator and macOS
    needs: ios_inputs
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.control || 'none') == 'none' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert arm64 macOS 26
        run: tools/ci/mac_assert.sh
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: ios-simulator-gate-inputs
          path: ${{ runner.temp }}/ios-artifacts
      - name: Compare XCFramework and qualify SDK links
        run: python3 tools/ci/ios_gate/link.py "$RUNNER_TEMP/ios-artifacts"
      - name: Run the same hosted XCTest on macOS and iOS
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        run: |
          command -v xcodegen || brew install xcodegen
          python3 tools/ci/ios_gate/test.py "$RUNNER_TEMP/ios-artifacts" "$RUNNER_TEMP/ios-results"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-simulator-gate-test-results
          path: ${{ runner.temp }}/ios-results
          if-no-files-found: ignore
          retention-days: 3

  ios_comparison:
    name: Measure both iOS counter hosts
    needs: ios_inputs
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.control || 'none') == 'none' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert arm64 macOS 26
        run: tools/ci/mac_assert.sh
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-gate-inputs
          path: ${{ runner.temp }}/ios-artifacts
      - name: Verify relaunch durability and measure the two arms
        run: |
          command -v xcodegen || brew install xcodegen
          python3 tools/ci/ios_gate/compare.py "$RUNNER_TEMP/ios-artifacts"

  aggregate:
    name: Strict Mac CI result
    needs: [plan, cross, mac, mac_driver_inputs, mac_driver, nightly_cross, nightly_native]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the Mac CI gate
        run: |
          python3 tools/ci/test_mac_aggregate.py
          python3 tools/ci/test_mac_native.py
      - name: Require a result or a planned exclusion for every job
        id: aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/mac_aggregate.py
