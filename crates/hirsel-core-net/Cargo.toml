[package]
name = "hirsel-core-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-config-schema = { path = "../hirsel-config-schema" }
libc = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
ring = "=0.17.14"
md-5 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sec1 = { version = "=0.8.1", default-features = false, features = ["der"] }
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "pkcs8"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
base64 = "=0.23.1"
base64ct = "=1.8.3"
stringprep = "=0.1.5"
subtle = "=2.6.1"
zeroize = "=1.9.2"
unicode-normalization = "=0.1.25"
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "=0.7.16", default-features = false }

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
