name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/PRIMER.md", "core/std/API-INDEX.md", "tools/site_sync.py", "tools/site_build.py", "tools/site_highlight.py", "editors/tree-sitter-hirsel/src/**", "editors/tree-sitter-hirsel/queries/highlights.scm", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/site_sync.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'tree-sitter==0.25.2'
      - run: python tools/site_highlight.py --check
      - run: python3 tools/site_build.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
