[package]
name = "hirsel-core-driver"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel-core"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
rustc-hash = "2"
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-diag = { path = "../hirsel-core-diag" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-core-front = { path = "../hirsel-core-front" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-cranelift = { path = "../hirsel-cranelift" }
hirsel-llvm-lazy = { path = "../hirsel-llvm-lazy" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-guard = { path = "../hirsel-guard" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3.3"
object = { version = "=0.40.0", default-features = false, features = ["elf", "read_core", "std", "build"] }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write", "std"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
hirsel-core-front = { path = "../hirsel-core-front", features = ["cost-profile"] }
tempfile = "3"
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["eval"] }

[build-dependencies]
sha2 = "0.10"
