[package]
name = "hirsel-core-ir"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The structural well-formedness function, for tests of this crate and of its producers.
wf = []
# The FORM v0 test evaluator, for producers' behaviour cases.
eval = []

[dependencies]
serde = { version = "1", features = ["derive"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-layout = { path = "../hirsel-core-layout" }

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
