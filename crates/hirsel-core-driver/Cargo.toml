[package]
name = "hirsel-core-driver"
version = "0.2.0-pre"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel"
path = "src/main.rs"

[[bench]]
name = "comptime_g1"
harness = false
required-features = ["comptime-g1"]

[[bench]]
name = "package_layer"
harness = false

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
# The opt-in comptime G1 measurement.
comptime-g1 = ["hirsel-core-eval/host-instructions"]

[dependencies]
hirsel-data = { path = "../hirsel-data" }
hirsel-config-schema = { path = "../hirsel-config-schema" }
hirsel-compiler = { path = "../hirsel-compiler" }
bytes = "1"
ring = "=0.17.14"
hirsel-prof = { path = "../hirsel-prof" }
hirsel-tape-format = { path = "../hirsel-tape-format" }
hirsel-core-net = { path = "../hirsel-core-net" }
cranelift-codegen = { version = "=0.136.3", default-features = false, features = ["std", "x86", "arm64", "unwind"] }
cranelift-frontend = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-object = { version = "=0.136.3", default-features = false }
mimalloc = { version = "=0.1.52", default-features = false, features = ["override"], optional = true }
rustc-hash = "2"
rustix = { version = "1.1.6", features = ["fs"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-diag = { path = "../hirsel-core-diag" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-core-front = { path = "../hirsel-core-front" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-materialize = { path = "../hirsel-core-materialize" }
# Computed constants run on the reference evaluator (LANG-20, MEM-34).
hirsel-core-eval = { path = "../hirsel-core-eval" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-mod = { path = "../hirsel-mod" }
hirsel-core-contained = { path = "../hirsel-core-contained", features = ["compile"] }
hirsel-cranelift = { path = "../hirsel-cranelift" }
hirsel-llvm-lazy = { path = "../hirsel-llvm-lazy" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-guard = { path = "../hirsel-guard" }
libc = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
object = { version = "=0.40.0", default-features = false, features = ["archive", "elf", "macho", "names", "read_core", "std", "write"] }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write", "std"] }
sha2 = "0.11"
# Git sources (packages.md GIT-9): SHA-1 with collision detection, and pack inflate.
sha1-checked = { version = "=0.11.0-rc.0", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
tempfile = "3"
zstd-safe = { version = "=7.2.4", default-features = false, features = ["std"] }
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"] }

[dev-dependencies]
hirsel-core-front = { path = "../hirsel-core-front", features = ["cost-profile"] }

[build-dependencies]
hirsel-config-schema = { path = "../hirsel-config-schema" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
sha2 = "0.11"
