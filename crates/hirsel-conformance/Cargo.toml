[package]
name = "hirsel-conformance"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "hirsel-conformance"

[dependencies]
hirsel-compiler-identity = { path = "../hirsel-compiler-identity" }
hirsel-native-batch = { path = "../hirsel-native-batch" }
hirsel-front-phases = { path = "../hirsel-front-phases" }
hirsel-native = { path = "../hirsel-native" }
hirsel-native-queries = { path = "../hirsel-native-queries" }
hirsel-native-testing = { path = "../hirsel-native-testing" }
hirsel-candidate = { path = "../hirsel-candidate" }
hirsel-interp = { path = "../hirsel-interp" }
hirsel-guard = { path = "../hirsel-guard" }
hirsel-run-config = { path = "../hirsel-run-config" }
hirsel-run-schema = { path = "../hirsel-run-schema" }
hirsel-cli-args = { path = "../hirsel-cli-args" }
hirsel-diag = { path = "../hirsel-diag" }
hirsel-driver = { path = "../hirsel-driver" }
hirsel-engine = { path = "../hirsel-engine" }
hirsel-intern = { path = "../hirsel-intern", features = ["id-salt"] }
hirsel-proof-export = { path = "../hirsel-proof-export" }
serde_json = "1"
hirsel-span = { path = "../hirsel-span" }
hirsel-syntax = { path = "../hirsel-syntax" }
hirsel-types = { path = "../hirsel-types" }

# Binaries without tests: no unit-test harness, which would relink the whole
# compiler on every edit. `native` keeps its tests.
[[bin]]
name = "hirsel-conformance"
path = "src/main.rs"
test = false

[[bin]]
name = "agree"
path = "src/bin/agree.rs"
test = false

[[bin]]
name = "corpus-fmt"
path = "src/bin/corpus-fmt.rs"
test = false

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
test = false

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
test = false

[[bin]]
name = "native-select"
path = "src/bin/native-select.rs"
test = false
