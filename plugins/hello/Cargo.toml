[package]
name = "hirsel-plugin-hello"
# The version the management API reports for this plugin. `scripts/sync-plugins.sh`
# reads it literally, so it must be spelled out here (no workspace inheritance).
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hirsel-plugin-api.workspace = true
axum = "0.7.9"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
