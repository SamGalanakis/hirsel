[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.wmo]
inherits = "release"
opt-level = 3
codegen-units = 1

[profile.no-checks]
inherits = "release"
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.max-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = false
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12"
once_cell = "1.18"
base64-simd = "0.8"
simd-csv = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "benchmarks"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 0
overflow-checks = true
codegen-units = 1
incremental = false
debug = false

[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
incremental = false
debug = false
lto = false
