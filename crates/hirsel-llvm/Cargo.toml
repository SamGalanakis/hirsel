[package]
name = "hirsel-llvm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hirsel_lazy_core)'] }

[dependencies]
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "std"] }
object = { version = "=0.40.0", default-features = false, features = ["elf", "macho", "read_core", "std", "write", "build"] }
llvm-sys = { version = "=231.0.1", default-features = false, features = ["strict-versioning", "force-dynamic"] }

[dev-dependencies]
tempfile = "3"
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write", "std"] }
hirsel-llvm-lazy = { path = "../hirsel-llvm-lazy" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-core-rt = { path = "../hirsel-core-rt", features = ["testing", "charge-observation"] }
hirsel-core-eval = { path = "../hirsel-core-eval" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["wf"] }
hirsel-guard = { path = "../hirsel-guard" }
