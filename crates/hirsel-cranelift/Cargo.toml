[package]
name = "hirsel-cranelift"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
native-tsan = []

[dependencies]
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-contract = { path = "../hirsel-core-contract" }
hirsel-graph = { path = "../hirsel-graph" }
hirsel-lir = { path = "../hirsel-lir" }
hirsel-syntax = { path = "../hirsel-syntax" }
cranelift-codegen = { version = "=0.136.3", default-features = false, features = ["std", "x86", "arm64", "unwind"] }
cranelift-frontend = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-object = { version = "=0.136.3", default-features = false }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write", "std"] }

[dev-dependencies]
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-front = { path = "../hirsel-core-front" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["eval", "wf"] }
hirsel-guard = { path = "../hirsel-guard" }
