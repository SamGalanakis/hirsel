name: Release
# A release is a function of the source and two pinned profiles. The train job
# trains them once; the build job takes them by hash, so anyone can rebuild the
# published compiler bit for bit from the profiles published beside it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (only when dispatched on a v* tag)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Bubblewrap needs an unmasked /proc to mount a fresh copy.
  DOCKER_OPTIONS: >-
    --rm --cpus 4 --memory 8g --memory-swap 8g
    --cap-add SYS_ADMIN --security-opt seccomp=unconfined
    --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    -w /src -e RELEASE_TAG
  IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
  SETUP: |
    dnf -y install bubblewrap dpkg zstd
    git config --global --add safe.directory /src
    curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
      sh -s -- -y --profile minimal --default-toolchain 1.99.0
    export PATH="/root/.cargo/bin:$PATH"
    cargo fetch --locked
    tools/native-toolchain/install --bolt-tools /tmp/hirsel-bolt-tools
    export PATH="/tmp/hirsel-bolt-tools/bin:$PATH"
jobs:
  train:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      profdata: ${{ steps.profiles.outputs.profdata }}
      fdata: ${{ steps.profiles.outputs.fdata }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the version
        id: version
        shell: bash
        run: |
          # The version is compiled into the BOLT input, so both jobs use this one value.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$GITHUB_REF_NAME
          else
            version=v0.0.0-dispatch.$GITHUB_RUN_ID
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Free runner disk for the instrumented and PGO-use build trees
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Train the PGO and BOLT profiles
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/profiles"
          # shellcheck disable=SC2086 # DOCKER_OPTIONS is a word list.
          docker run $DOCKER_OPTIONS -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/profiles:/profiles" \
            "$IMAGE" bash -euxo pipefail -c "$SETUP"'
            tools/toolchain-dist/build --train-profile /profiles --work /tmp/train-work \
              --cpu 3 --local --num-threads 4
          '
      - name: Name the profiles by hash
        id: profiles
        working-directory: ${{ runner.temp }}/profiles
        shell: bash
        run: |
          profdata=(*.profdata) fdata=(*.fdata)
          [[ ${#profdata[@]} == 1 && ${#fdata[@]} == 1 ]]
          ls -l
          echo "profdata=${profdata%.profdata}" >> "$GITHUB_OUTPUT"
          echo "fdata=${fdata%.fdata}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: ${{ runner.temp }}/profiles
          compression-level: 0

  build:
    needs: train
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check installer release resolution
        run: dash tools/toolchain-dist/check-installer
      - uses: actions/download-artifact@v4
        with:
          name: profiles
          path: ${{ runner.temp }}/profiles
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build from the pinned profiles and qualify the Linux distribution
        env:
          RELEASE_TAG: ${{ needs.train.outputs.version }}
          PROFDATA: ${{ needs.train.outputs.profdata }}
          FDATA: ${{ needs.train.outputs.fdata }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          # shellcheck disable=SC2086 # DOCKER_OPTIONS is a word list.
          docker run $DOCKER_OPTIONS -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/profiles:/profiles:ro" \
            -v "$RUNNER_TEMP/release:/release" -e PROFDATA -e FDATA "$IMAGE" bash -euxo pipefail -c "$SETUP"'
            tools/toolchain-dist/build --pgo "/profiles/$PROFDATA.profdata" --bolt "/profiles/$FDATA.fdata" \
              --local --num-threads 4 --output /tmp/hirsel-prefix
            tools/toolchain-dist/build --check-fresh /tmp/hirsel-prefix
            asset=hirsel-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz
            tar -czf "/release/$asset" -C /tmp/hirsel-prefix .
            cp site/install.sh "/profiles/$PROFDATA.profdata" "/profiles/$FDATA.fdata" /release/
            cd /release
            sha256sum "$asset" > SHA256SUMS
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ runner.temp }}/release
          compression-level: 0

  smoke:
    needs: [train, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, debian:bookworm-slim, ubuntu:24.04, debian:trixie-slim]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ${{ runner.temp }}/release
      - name: Exercise the installer on ${{ matrix.image }}
        env:
          HIRSEL_VERSION: ${{ needs.train.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          # The executable writer uses unshare(CLONE_FILES), which Docker's default filter denies.
          docker run --rm --cpus 4 --memory 8g --memory-swap 8g \
            --security-opt seccomp=unconfined \
            -v "$RUNNER_TEMP/release:/release:ro" -e HIRSEL_VERSION \
            -e HIRSEL_DOWNLOAD_BASE=file:///release "$IMAGE" dash -ec '
              packages=$(dpkg-query -W -f="\${Package} \${Status}\n")
              if printf "%s\n" "$packages" | grep -E "^(libc6-dev|libgcc-[0-9]+-dev) install ok installed$"; then
                exit 1
              fi
              exec 3>&2 2>/tmp/hirsel-smoke.stderr
              trap "cat /tmp/hirsel-smoke.stderr >&3" 0
              dash /release/install.sh
              . "$HOME/.hirsel/env"
              test "$(command -v hirsel)" = "$HOME/.hirsel/bin/hirsel"
              case "$(command -v ld.lld || :)" in
                "$HOME/.hirsel/"*) exit 1 ;;
              esac
              hirsel --version
              hirsel new demo
              cd demo
              hirsel test
              hirsel run
              hirsel build
              sed -i "/^\[dependencies\]/a store = { major = 1 }" hirsel.toml
              sed -i "/^pub fn main/a\    let _ = result.unwrap(store.sized(Directory, 2147483648u64))" main.hirsel
              hirsel lock 2>&3
              hirsel check --locked
              test ! -s /tmp/hirsel-smoke.stderr
            '

  publish:
    needs: [train, smoke]
    # A dispatch publishes only when asked, and never from a branch.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ${{ runner.temp }}/release
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.train.outputs.version }}
        working-directory: ${{ runner.temp }}/release
        shell: bash
        run: |
          version=${RELEASE_TAG%%+*}
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false --notes "Hirsel $RELEASE_TAG.")
          else
            release_flags=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" --verify-tag "${release_flags[@]}" -- ./hirsel-*.tar.gz ./SHA256SUMS ./install.sh ./*.profdata ./*.fdata
