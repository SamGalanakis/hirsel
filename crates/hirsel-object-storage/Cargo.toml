[package]
name = "hirsel-object-storage"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The fake S3 server (`fake_s3`), for this crate's and hirsel-store-authority's tests.
testing = []

[dependencies]
hirsel-run-schema = { path = "../hirsel-run-schema" }
libc = "0.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
webpki-roots = "=1.0.9"

[dev-dependencies]
hirsel-object-storage = { path = ".", features = ["testing"] }
hirsel-guard = { path = "../hirsel-guard" }
tempfile = "3"
