[package]
name = "hirsel-core-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel-core-syntax"
path = "src/main.rs"
required-features = ["formatter"]

[features]
default = ["formatter"]
formatter = ["dep:hirsel-guard"]

[dependencies]
hirsel-guard = { path = "../hirsel-guard", optional = true }
hirsel-core-ids = { path = "../hirsel-core-ids" }
serde = { version = "1", features = ["derive", "rc"] }

rustc-hash = "2"
smallvec = "1"

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
tempfile = "3"
serde_json = "1"
