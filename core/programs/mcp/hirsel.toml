[package]
name = "mcp"
version = "1.0.0"
charge = "charge-v1"

[sources]
"rpc.hirsel" = "rpc"
"metadata.hirsel" = "metadata"
"client.hirsel" = "client"
"server.hirsel" = "server"
"sessions.hirsel" = "sessions"
"tests/interop.hirsel" = "interop"

[dependencies]
std = { major = 1 }

[tests]
limit = 33554432
grants = ["Clock", "Tasks", "Net=Listen 127.0.0.0/8 0-65535;Connect 127.0.0.0/8 0-65535"]

[tests.sources]
"tests/rpc.hirsel" = "laws"
"tests/legacy.hirsel" = "laws"
"example.hirsel" = "example"

[tests.runs."mcp@1/laws/tool_context_reads_fixture"]
dirs = ["."]
