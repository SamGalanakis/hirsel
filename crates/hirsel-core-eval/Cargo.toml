[package]
name = "hirsel-core-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Record each map operation's probes for the map-observation harness.
map-observation = []
# PureRun::host: the pure thread's retired host instructions, for the G1 probe
# (hirsel-core-driver's `comptime-g1` feature).
host-instructions = ["dep:hirsel-intern"]

[dependencies]
hirsel-data = { path = "../hirsel-data" }
hirsel-intern = { path = "../hirsel-intern", optional = true }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-net = { path = "../hirsel-core-net" }
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"] }
zeroize = "=1.9.2"

[dev-dependencies]
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["wf"] }
hirsel-guard = { path = "../hirsel-guard" }
serde_json = "1"
