[package]
name = "hirsel-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.7.9", features = ["ws", "macros"] }
base64 = "0.22.1"
chrono.workspace = true
futures-util.workspace = true
hirsel-drivers.workspace = true
hirsel-proto.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
lash-core.workspace = true
lash.workspace = true
lash-provider-anthropic.workspace = true
lash-provider-openai.workspace = true
lash-protocol-rlm.workspace = true
lash-sqlite-store.workspace = true
libc.workspace = true
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http = { version = "0.6.6", features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
hirsel-client-core = { path = "../hirsel-client-core" }
jsonschema = "0.18"
tokio-tungstenite = "0.24.0"

[lib]
name = "hirsel_host"
path = "src/lib.rs"

[[bin]]
name = "hirsel-host"
path = "src/main.rs"
