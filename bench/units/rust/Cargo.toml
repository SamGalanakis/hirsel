[package]
name = "units-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "=0.2.191"
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "rt", "sync", "macros", "time", "net", "io-util", "fs"] }
sha2 = { version = "=0.10.9", default-features = false }

[features]
software-sha = ["sha2/force-soft"]

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
