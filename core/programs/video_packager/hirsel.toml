[package]
name = "hirsel.ai/video_packager"
version = "1.0.0"
charge = "charge-v1"

[dependencies]
std = { major = 1 }
media_bits = { package = "media_bits", major = 1, path = "../media_bits" }
media_container = { package = "media_container", major = 1, path = "../media_container", authority = ["Dir"] }

[sources]
"cmaf.hirsel" = "packager"
"hls.hirsel" = "packager"
"dash.hirsel" = "packager"
"low_latency.hirsel" = "packager"

[tests]
limit = 16777216
grants = []

[tests.sources]
"example.hirsel" = "tests"
"hls_laws.hirsel" = "tests"
"dash_laws.hirsel" = "tests"
"low_latency_laws.hirsel" = "tests"
