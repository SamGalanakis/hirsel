[package]
name = "hirsel-core-driver"
version = "0.1.0-pre"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel"
path = "src/main.rs"

[dependencies]
bytes = "1"
hirsel-prof = { path = "../hirsel-prof" }
hirsel-tape-format = { path = "../hirsel-tape-format" }
hirsel-core-net = { path = "../hirsel-core-net" }
cranelift-codegen = { version = "=0.136.3", default-features = false, features = ["std", "x86", "arm64", "unwind"] }
cranelift-frontend = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-object = { version = "=0.136.3", default-features = false }
mimalloc = { version = "=0.1.52", default-features = false, features = ["override"] }
rustc-hash = "2"
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-diag = { path = "../hirsel-core-diag" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-core-front = { path = "../hirsel-core-front" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["snapshot"] }
hirsel-core-materialize = { path = "../hirsel-core-materialize" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-cranelift = { path = "../hirsel-cranelift" }
hirsel-llvm-lazy = { path = "../hirsel-llvm-lazy" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-guard = { path = "../hirsel-guard" }
libc = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
toml_edit = { version = "0.22.27", default-features = false, features = ["parse", "display"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
object = { version = "=0.40.0", default-features = false, features = ["archive", "elf", "names", "read_core", "std", "write"] }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write", "std"] }
sha2 = "0.11"
tempfile = "3"
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"] }

[dev-dependencies]
hirsel-core-front = { path = "../hirsel-core-front", features = ["cost-profile"] }
tempfile = "3"
hirsel-core-eval = { path = "../hirsel-core-eval" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["wf"] }

[build-dependencies]
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
sha2 = "0.11"
