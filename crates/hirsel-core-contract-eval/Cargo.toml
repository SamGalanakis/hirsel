[package]
name = "hirsel-core-contract-eval"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel-core-contract-eval"
path = "src/main.rs"
test = false

[dependencies]
hirsel-core-front = { path = "../hirsel-core-front", features = ["test-assembly"] }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["eval"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-guard = { path = "../hirsel-guard" }
serde_json = "1"
