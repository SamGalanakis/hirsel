# The pinned LLVM for llvm-sys (tools/native-toolchain/llvm-23.lock). An LLVM_SYS_231_PREFIX
# already in the environment wins, for example a local `install --unpack` prefix.
[env]
LLVM_SYS_231_PREFIX = { value = "tools/buck2/toolchains/llvm-files", relative = true, force = false }
# C built by build scripts (cc) sees one fixed build date: mimalloc embeds
# __DATE__ __TIME__ (tools/buck2/toolchains/fixed-build-date does this for Buck).
SOURCE_DATE_EPOCH = { value = "0", force = false }
# Tests run at most 4 at a time (the compiler tests use large thread stacks).
RUST_TEST_THREADS = { value = "4", force = false }
# Worker threads of the agreement campaign and other in-process fan-outs.
HIRSEL_JOBS = { value = "4", force = false }

# One cargo invocation uses at most 4 jobs. CARGO_BUILD_JOBS in the environment overrides this.
[build]
jobs = 4
