[workspace]
members = [
  "crates/hirsel-proto",
  "crates/hirsel-client-core",
  "crates/hirsel-client-ffi",
  "crates/hirsel-drivers",
  "crates/hirsel-host",
  "crates/hirsel-plugin-api",
  "crates/hirsel-plugins",
  # In-tree plugins: installing one is dropping the folder in, running
  # scripts/sync-plugins.sh, and rebuilding (see docs/plugins.md).
  "plugins/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
futures-util = "0.3.31"
hirsel-drivers = { path = "crates/hirsel-drivers" }
hirsel-plugin-api = { path = "crates/hirsel-plugin-api" }
hirsel-plugins = { path = "crates/hirsel-plugins" }
hirsel-proto = { path = "crates/hirsel-proto" }
iroh = "=1.0.2"
iroh-tickets = "=1.0.0"
indexmap = "2.14.0"
lash-core = { package = "lash-internal-core", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
lash = { package = "lash-runtime", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c", features = ["rlm"] }
lash-provider-anthropic = { package = "lash-internal-provider-anthropic", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
lash-provider-openai = { package = "lash-internal-provider-openai", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
lash-protocol-rlm = { package = "lash-internal-protocol-rlm", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
lash-protocol-standard = { package = "lash-internal-protocol-standard", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
lash-sqlite-store = { package = "lash-internal-sqlite-store", git = "https://github.com/Ascending-AI/lash", rev = "81ac79c7ccb3191dd5107f9366edbdd8dcc24c9c" }
libc = "0.2.177"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
