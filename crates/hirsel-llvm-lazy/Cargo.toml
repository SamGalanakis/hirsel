[package]
name = "hirsel-llvm-lazy"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hirsel-core-ids = { path = "../hirsel-core-ids" }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "std"] }
object = { version = "=0.40.0", default-features = false, features = ["elf", "read_core", "std", "build"] }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
