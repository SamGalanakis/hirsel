[package]
name = "multicore-tokio"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "multicore-tokio"

[workspace]

[dependencies]
bumpalo = "=3.20.3"
hashbrown = "=0.16.1"
rayon = "=1.12.0"
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
futures-util = "=0.3.34"
serde_json = "=1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
