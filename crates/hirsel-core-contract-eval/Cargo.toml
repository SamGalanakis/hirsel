[package]
name = "hirsel-core-contract-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel-core-contract-eval"
path = "src/main.rs"
test = false

[dependencies]
hirsel-compiler = { path = "../hirsel-compiler" }
hirsel-core-driver = { path = "../hirsel-core-driver" }
hirsel-core-materialize = { path = "../hirsel-core-materialize" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-eval = { path = "../hirsel-core-eval" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["wf"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-guard = { path = "../hirsel-guard" }
serde_json = "1"
tempfile = "3"
