[workspace]
members = [
  "crates/hirsel-proto",
  "crates/hirsel-client-core",
  "crates/hirsel-client-ffi",
  "crates/hirsel-drivers",
  "crates/hirsel-host",
  "crates/hirsel-plugin-api",
  "crates/hirsel-plugins",
  # In-tree plugins: installing one is dropping the folder in, running
  # scripts/sync-plugins.sh, and rebuilding (see docs/plugins.md).
  "plugins/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
futures-util = "0.3.31"
hirsel-drivers = { path = "crates/hirsel-drivers" }
hirsel-plugin-api = { path = "crates/hirsel-plugin-api" }
hirsel-plugins = { path = "crates/hirsel-plugins" }
hirsel-proto = { path = "crates/hirsel-proto" }
iroh = "=1.0.2"
iroh-tickets = "=1.0.0"
lash-core = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
lash = { package = "lash-runtime", git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5", features = ["rlm"] }
lash-provider-anthropic = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
lash-provider-openai = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
lash-protocol-rlm = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
lash-sqlite-store = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
libc = "0.2.177"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# lash's lashlang VM needs the fuel/step-budget instrumentation in its vendored
# regress fork (`vendor/regress` in the lash repo, published nowhere). lash
# applies this patch in its own workspace root, and a `[patch]` from a
# dependency never reaches its consumers, so hirsel has to restate it against
# the same rev or `regress::MatchError` is missing at compile time.
[patch.crates-io]
regress = { git = "https://github.com/Ascending-AI/lash", rev = "130052fa6246b407540996f7ccef07f859afbea5" }
