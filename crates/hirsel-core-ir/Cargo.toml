[package]
name = "hirsel-core-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Structural well-formedness for producer tests and checked CoreIR export.
wf = []
snapshot = ["wf", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", optional = true }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-layout = { path = "../hirsel-core-layout" }

[dev-dependencies]
serde_json = "1"
hirsel-guard = { path = "../hirsel-guard" }
