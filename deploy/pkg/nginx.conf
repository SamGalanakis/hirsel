worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 8080;
        client_max_body_size 513m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        location = / {
            default_type text/plain;
            return 200 "single-operator signed-log wipeable preview (quorum 0), unwitnessed\n";
        }
        location = /.well-known/hirsel-registry.json {
            default_type application/json;
            alias /etc/hirsel/registry/enrollment.json;
        }
        location = /mcp { proxy_pass http://127.0.0.1:8112; }
        location /v1/discovery/ { proxy_pass http://127.0.0.1:8113; }
        location / { proxy_pass http://127.0.0.1:8111; }
    }
}
