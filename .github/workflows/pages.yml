name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/PRIMER.md", "core/std/API-INDEX.md", "tools/site_sync.py", "tools/site_build.py", "tools/site_highlight.py", "tools/site.wrangler.jsonc", "editors/tree-sitter-hirsel/src/**", "editors/tree-sitter-hirsel/queries/highlights.scm", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/site_sync.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'tree-sitter==0.25.2'
      - run: python tools/site_highlight.py --check
      - run: python3 tools/site_build.py _site
      - run: npx --yes wrangler@4.166.0 deploy -c tools/site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
