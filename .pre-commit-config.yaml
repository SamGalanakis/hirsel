repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(android/app/src/main/kotlin/dev/hirsel/core/hirsel_client_ffi\.kt|\.vite/deps/)'
      - id: end-of-file-fixer
        exclude: '^(android/app/src/main/kotlin/dev/hirsel/core/hirsel_client_ffi\.kt|\.vite/deps/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: block-sensitive-files
        name: Block sensitive files
        language: fail
        entry: Sensitive files must never be committed
        files: '(?i)(^|/)(google-services\.json|[^/]*service[-_]account[^/]*\.json|fcm-[^/]*service[^/]*\.json|[^/]*firebase-admin[^/]*\.json|[^/]*credentials[^/]*\.json|[^/]*\.(keystore|jks|p12|pfx|pkcs12|pem|key|der|kdbx|mobileprovision))$'

      - id: check-static
        name: static checks
        language: system
        entry: bash scripts/check-static.sh
        pass_filenames: false
        always_run: true
