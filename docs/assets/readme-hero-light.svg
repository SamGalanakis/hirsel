<svg xmlns="http://www.w3.org/2000/svg" width="780" height="388" viewBox="0 0 780 388" role="img" aria-label="Hirsel hello world example showing explicit Stdout capability, mutable List and String, and waits effect">
  <title>main.hirsel &#x2014; hirsel</title>
  <style>
    .title { font: 500 12.5px/1 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Consolas, Menlo, 'Liberation Mono', monospace; fill: #24292f; }
    .badge { font: 500 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; letter-spacing: 0.02em; }
    .ln { font: 400 12.5px/1 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Consolas, Menlo, 'Liberation Mono', monospace; fill: #8c959f; }
    .code { font: 400 14px/1 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Consolas, Menlo, 'Liberation Mono', monospace; fill: #1f2328; }
    .k { fill: #b9231b; font-weight: 600; }
    .d { fill: #1d5a9e; font-weight: 600; }
    .f { fill: #1d5a9e; }
    .t { fill: #8a5017; }
    .v { fill: #3d6423; }
    .o { fill: #656d76; }
    .c { fill: #6e7781; font-style: italic; }
  </style>
  <rect x="0.5" y="0.5" width="779" height="387" rx="10" ry="10" fill="#f6f8fa"/>
  <path d="M1,10 A9,9 0 0 1 10,1 H770 A9,9 0 0 1 779,10 V40 H1 Z" fill="#eff2f5"/>
  <line x1="1" y1="40.5" x2="779" y2="40.5" stroke="#d8dee4" stroke-width="1"/>
  <circle cx="22" cy="20.5" r="4" fill="#cb271f"/>
  <text x="35" y="25" class="title">main.hirsel</text>
  <rect x="708" y="10.5" width="54" height="20" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="735" y="24" text-anchor="middle" class="badge">hirsel</text>
  <text x="44" y="74" text-anchor="end" class="ln">1</text>
  <text x="64" y="74" class="code" xml:space="preserve"><tspan class="k">pub</tspan> <tspan class="k">fn</tspan> <tspan class="d">main</tspan><tspan class="o">(</tspan>out<tspan class="o">:</tspan> <tspan class="t">Stdout</tspan><tspan class="o">)</tspan> <tspan class="o">-&gt;</tspan> <tspan class="t">Result</tspan><tspan class="o">[</tspan><tspan class="o">(</tspan><tspan class="o">)</tspan><tspan class="o">,</tspan> <tspan class="t">WriteError</tspan><tspan class="o">]</tspan> <tspan class="k">waits</tspan> <tspan class="o">{</tspan></text>
  <text x="44" y="98" text-anchor="end" class="ln">2</text>
  <text x="80.8" y="98" class="code" xml:space="preserve"><tspan class="k">let</tspan> <tspan class="k">mut</tspan> names<tspan class="o">:</tspan> <tspan class="t">List</tspan><tspan class="o">[</tspan><tspan class="t">String</tspan><tspan class="o">]</tspan> <tspan class="o">=</tspan> list<tspan class="o">.</tspan><tspan class="f">new</tspan><tspan class="o">(</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="122" text-anchor="end" class="ln">3</text>
  <text x="80.8" y="122" class="code" xml:space="preserve">list<tspan class="o">.</tspan><tspan class="f">push</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> names<tspan class="o">,</tspan> <tspan class="v">"ada"</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="146" text-anchor="end" class="ln">4</text>
  <text x="80.8" y="146" class="code" xml:space="preserve">list<tspan class="o">.</tspan><tspan class="f">push</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> names<tspan class="o">,</tspan> <tspan class="v">"grace"</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="170" text-anchor="end" class="ln">5</text>
  <text x="80.8" y="170" class="code" xml:space="preserve"><tspan class="k">let</tspan> <tspan class="k">mut</tspan> line <tspan class="o">=</tspan> string<tspan class="o">.</tspan><tspan class="f">new</tspan><tspan class="o">(</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="194" text-anchor="end" class="ln">6</text>
  <text x="80.8" y="194" class="code" xml:space="preserve"><tspan class="k">for</tspan> n <tspan class="k">in</tspan> names <tspan class="o">{</tspan></text>
  <text x="44" y="218" text-anchor="end" class="ln">7</text>
  <text x="97.6" y="218" class="code" xml:space="preserve">string<tspan class="o">.</tspan><tspan class="f">push</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> line<tspan class="o">,</tspan> n<tspan class="o">)</tspan></text>
  <text x="44" y="242" text-anchor="end" class="ln">8</text>
  <text x="97.6" y="242" class="code" xml:space="preserve">string<tspan class="o">.</tspan><tspan class="f">push</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> line<tspan class="o">,</tspan> <tspan class="v">" "</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="266" text-anchor="end" class="ln">9</text>
  <text x="80.8" y="266" class="code" xml:space="preserve"><tspan class="o">}</tspan></text>
  <text x="44" y="290" text-anchor="end" class="ln">10</text>
  <text x="80.8" y="290" class="code" xml:space="preserve">string<tspan class="o">.</tspan><tspan class="f">push_u64</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> line<tspan class="o">,</tspan> list<tspan class="o">.</tspan><tspan class="f">len</tspan><tspan class="o">(</tspan>names<tspan class="o">)</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="314" text-anchor="end" class="ln">11</text>
  <text x="80.8" y="314" class="code" xml:space="preserve">string<tspan class="o">.</tspan><tspan class="f">push</tspan><tspan class="o">(</tspan><tspan class="k">mut</tspan> line<tspan class="o">,</tspan> <tspan class="v">"\n"</tspan><tspan class="o">)</tspan></text>
  <text x="44" y="338" text-anchor="end" class="ln">12</text>
  <text x="80.8" y="338" class="code" xml:space="preserve">stdout<tspan class="o">.</tspan><tspan class="f">write</tspan><tspan class="o">(</tspan>out<tspan class="o">,</tspan> line<tspan class="o">)</tspan></text>
  <text x="44" y="362" text-anchor="end" class="ln">13</text>
  <text x="64" y="362" class="code" xml:space="preserve"><tspan class="o">}</tspan></text>
  <rect x="0.5" y="0.5" width="779" height="387" rx="10" ry="10" fill="none" stroke="#d0d7de" stroke-width="1"/>
</svg>
