name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Enable pinned npm
        run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npm run lint

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check Android-related paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/hirsel-client-*/**'
              - 'crates/hirsel-proto/**'
              - '.github/workflows/ci.yml'

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        if: steps.changes.outputs.android == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.changes.outputs.android == 'true'
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        if: steps.changes.outputs.android == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Rust builds
        if: steps.changes.outputs.android == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        if: steps.changes.outputs.android == 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Write placeholder Firebase configuration
        if: steps.changes.outputs.android == 'true'
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "hirsel-ci"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "dev.hirsel.android"
                }
              },
              "api_key": [{"current_key": "ci-placeholder-not-a-real-api-key"}]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Regenerate Android native libraries and Kotlin bindings
        if: steps.changes.outputs.android == 'true'
        run: |
          rm -rf android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          rm -f android/app/src/main/kotlin/dev/hirsel/core/hirsel_client_ffi.kt
          cargo ndk \
            --target arm64-v8a \
            --target x86_64 \
            --platform 26 \
            --output-dir android/app/src/main/jniLibs \
            build --release -p hirsel-client-ffi
          cargo build --release -p hirsel-client-ffi
          target_dir="$(cargo metadata --format-version=1 --no-deps | jq -r .target_directory)"
          cargo run --release -p hirsel-client-ffi --features bindgen-cli --bin uniffi-bindgen -- \
            generate \
            --library "$target_dir/release/libhirsel_client_ffi.so" \
            --language kotlin \
            --config crates/hirsel-client-ffi/uniffi.toml \
            --out-dir android/app/src/main/kotlin \
            --no-format

      - name: Build debug APK
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: ./gradlew assembleDebug
