# Published hosts, independent of the targets their runtime archives support.
[hosts.x86_64-unknown-linux-gnu]
platform = "Linux-x86_64"
runner = "ubuntu-24.04"
llvm_library = "lib/libLLVM.so.23.1"
llvm_engine_dir = "engine"

[hosts.aarch64-apple-darwin]
platform = "Darwin-arm64"
runner = "macos-26"
llvm_library = "lib/libLLVM.23.1.dylib"

[runtime_targets]
x86_64-unknown-linux-gnu = { platform = "root//tools/buck2:runtime-x86_64", exec_helper = true }
aarch64-unknown-linux-gnu = { platform = "root//tools/buck2:runtime-aarch64", exec_helper = true }
aarch64-apple-darwin = { platform = "root//tools/buck2:runtime-darwin", exec_helper = true }
aarch64-apple-ios = { platform = "root//tools/buck2:runtime-ios", slots = ["embed-runtime"] }
aarch64-apple-ios-sim = { platform = "root//tools/buck2:runtime-ios-sim", slots = ["embed-runtime"] }

# Keys are std-product options. `buck_suffix` preserves existing archive labels.
# A `buck_suffix` enables archive production. Registration names use
# `observation` and the presence of the `record` feature.
[runtime_slots.runtime]
buck_suffix = ""
features = ["standalone"]
observation = "none"

[runtime_slots.recording-runtime]
buck_suffix = "-record"
features = ["standalone", "record"]
observation = "none"

[runtime_slots.prof-runtime]
buck_suffix = "-prof"
features = ["standalone", "prof"]
observation = "prof"

[runtime_slots.prof-recording-runtime]
buck_suffix = "-prof-record"
features = ["standalone", "prof", "record"]
observation = "prof"

[runtime_slots.observed-runtime]
buck_suffix = "-observed"
features = ["standalone", "charge-observation"]
observation = "observed"

[runtime_slots.observed-recording-runtime]
buck_suffix = "-observed-record"
features = ["standalone", "charge-observation", "record"]
observation = "observed"

[runtime_slots.embed-runtime]
buck_suffix = "-embed"
crate = "hirsel-core-rt"
features = []
observation = "none"

[sockets]
launcher = "launcher.sock"
operator = "operator.sock"

# Helper entry paths relative to the selected package's name and major.
[helpers.platform_main]
entry = "platform_main/main"
embedded = true
grants = ["Clock", "Random", "Tasks", "Net=UnixRoot ctl {cwd};UnixConnect ctl {launcher};UnixListen ctl {operator}"]
dirs = ["{cwd}/catalog"]

[helpers.pin_reader]
entry = "platform_main/read_pin"
grants = ["Clock", "Stdout"]
dirs = ["{cwd}/catalog"]

[helpers.store_tool]
entry = "store_tool/main"
grants = ["Clock", "Random", "Tasks", "Stdout", "Stderr"]
dirs = ["{fd}/3", "{fd}/4"]
