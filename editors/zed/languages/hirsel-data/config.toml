name = "Hirsel Config"
grammar = "hirsel_data"
path_suffixes = ["hcfg"]
line_comments = ["// "]
tab_size = 4
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
