# TLS front on 443 for one HTTPS name and one stream name (launch.md H1).
# The platform generator writes only HAProxy, so this file is written by hand.
# Every stream server terminates TLS on the socket that owns 443 and picks its
# server by SNI alone, so the PROXY v2 header names the client and 443.
events {}

stream {
    # No SNI, or a name not below: refuse the handshake. Never a stream listener.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        server_name stream.test;
        ssl_certificate /etc/nginx/certs/stream.crt;
        ssl_certificate_key /etc/nginx/certs/stream.key;
        proxy_pass 127.0.0.1:18202;
        # nginx sends version 2 only with an explicit v2 (1.31.4 and later).
        proxy_protocol v2;
        # Longer than the stream listener's own idle rule.
        proxy_timeout 300s;
    }

    # The HTTPS name crosses to the http block below over loopback.
    server {
        listen 443 ssl;
        server_name web.test;
        ssl_certificate /etc/nginx/certs/web.crt;
        ssl_certificate_key /etc/nginx/certs/web.key;
        proxy_pass 127.0.0.1:18203;
        proxy_protocol v2;
    }
}

http {
    server {
        listen 127.0.0.1:18203 proxy_protocol;
        location / {
            proxy_pass http://127.0.0.1:18201;
            proxy_set_header Host $host;
            # Replace any client-supplied field with the one client address.
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        }
    }
}
