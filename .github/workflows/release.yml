name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag (for example, v0.2.0)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_VERSION"
          if [[ -z "$tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v$tag"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$tag"
          if (( GITHUB_RUN_NUMBER > 2147483647 )); then
            echo "GitHub run number exceeds Android's versionCode limit." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_hirselVersionName=${tag#v}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_hirselVersionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f status=completed \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "Commit $RELEASE_SHA has no successful completed CI workflow run." >&2
            exit 1
          fi

      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [[ -z "$GOOGLE_SERVICES_JSON_B64" ]]; then
            echo 'GOOGLE_SERVICES_JSON_B64 must be configured for an Android release.' >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Configure release signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_B64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name must be configured for an Android release." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/hirsel-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Build Android native libraries and Kotlin bindings from source
        run: |
          rm -rf android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          rm -f android/app/src/main/kotlin/dev/hirsel/core/hirsel_client_ffi.kt
          cargo ndk \
            --target arm64-v8a \
            --target x86_64 \
            --platform 26 \
            --output-dir android/app/src/main/jniLibs \
            build --release -p hirsel-client-ffi
          cargo build --release -p hirsel-client-ffi
          target_dir="$(cargo metadata --format-version=1 --no-deps | jq -r .target_directory)"
          cargo run --release -p hirsel-client-ffi --features bindgen-cli --bin uniffi-bindgen -- \
            generate \
            --library "$target_dir/release/libhirsel_client_ffi.so" \
            --language kotlin \
            --config crates/hirsel-client-ffi/uniffi.toml \
            --out-dir android/app/src/main/kotlin \
            --no-format

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signing certificate and rename APK
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          source_apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          "$apksigner" verify --verbose "$source_apk"
          expected="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          actual="$("$apksigner" verify --print-certs "$source_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          actual="$(printf '%s' "$actual" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'EXPECTED_SIGNING_CERT_SHA256 must be a 64-digit SHA-256 fingerprint.' >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "Signing certificate fingerprint mismatch: got $actual" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$source_apk" "dist/hirsel-$RELEASE_VERSION.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hirsel-${{ env.RELEASE_VERSION }}-apk
          path: dist/hirsel-${{ env.RELEASE_VERSION }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Hirsel ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Sideload: enable Install unknown apps, download the APK, then tap it to install.
          files: dist/hirsel-${{ env.RELEASE_VERSION }}.apk
