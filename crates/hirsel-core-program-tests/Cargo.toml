[package]
name = "hirsel-core-program-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
hirsel-core-driver = { path = "../hirsel-core-driver" }
hirsel-core-front = { path = "../hirsel-core-front" }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["eval", "wf"] }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-materialize = { path = "../hirsel-core-materialize" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-guard = { path = "../hirsel-guard" }
tempfile = "3"
hirsel-cranelift = { path = "../hirsel-cranelift" }
hirsel-llvm = { path = "../hirsel-llvm" }
hirsel-llvm-lazy = { path = "../hirsel-llvm-lazy" }
cranelift-codegen = { version = "=0.136.3", default-features = false, features = ["timing"] }
cranelift-module = { version = "=0.136.3", default-features = false, features = ["std"] }
cranelift-object = { version = "=0.136.3", default-features = false }
hirsel-intern = { path = "../hirsel-intern" }
object = { version = "=0.40.0", default-features = false, features = ["elf", "read_core", "std", "write", "build"] }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "std"] }
llvm-sys = { version = "=231.0.1", default-features = false, features = ["strict-versioning", "force-dynamic"] }

[dev-dependencies]
hirsel-core-net = { path = "../hirsel-core-net" }
serde_json = "1"
