[package]
name = "hirsel.ai/webrtc_sfu_service"
version = "1.0.0"
charge = "charge-v1"

[dependencies]
std = { major = 1 }
webrtc_sfu = { package = "webrtc_sfu", major = 1, path = "..", authority = ["Net", "Clock", "Random", "Stdout", "Tasks", "Secret"] }
turn = { package = "turn", major = 1, path = "../../turn", authority = ["Random", "Secret"] }
runner = { package = "runner", major = 1, path = "../../runner", authority = ["Dir", "Net", "Clock", "Random", "Stderr", "Process", "Tasks", "Args", "Secret", "Cred"] }
store = { package = "store", major = 1, path = "../../store", authority = ["Dir", "Clock", "Random", "Tasks"] }

[sources]
"main.hirsel" = "main"
"config.hirsel" = "config"
