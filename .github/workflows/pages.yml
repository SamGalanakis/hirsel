name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "docs/PRIMER.md", "docs/COOKBOOK.md", "docs/spec/**", "docs/assets/readme-hero-*.svg", "core/std/API-INDEX.md", "skills/hirsel/SKILL.md", "tools/site_sync.py", "tools/site_build.py", "tools/site_highlight.py", "tools/site_docs.py", "tools/site_docs_theme.py", "tools/site_spec.py", "tools/site_benchmarks.py", "tools/site_check_links.py", "tools/render_code_svg.py", "tools/site.wrangler.jsonc", "editors/tree-sitter-hirsel/src/**", "editors/tree-sitter-hirsel/queries/highlights.scm", ".github/workflows/pages.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/site_sync.py --check
      - run: python3 tools/site_benchmarks.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'tree-sitter==0.25.2'
      - run: python tools/site_highlight.py --check
      - name: Build site aligned to latest release tag and check links
        run: |
          RELEASE_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$RELEASE_TAG" ]; then
            echo "Deploying site docs aligned to $RELEASE_TAG"
            python3 tools/site_build.py _site --release-tag "$RELEASE_TAG"
            python3 tools/site_check_links.py --site-dir _site --release-tag "$RELEASE_TAG"
          else
            python3 tools/site_build.py _site
            python3 tools/site_check_links.py --site-dir _site
          fi
      - run: npx --yes wrangler@4.166.0 deploy -c tools/site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
