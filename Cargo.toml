[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SamGalanakis/hirsel-lang"
rust-version = "1.99"

[profile.dev]
debug = "line-tables-only"
# Line tables stay in .dwo files beside the objects instead of being copied into every test
# binary: links write about a third less and backtraces still resolve.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# Workspace crates whose dev opt-level 1 saves more test seconds per run than it adds
# compile seconds per edit, each measured: the shared data crates. Debug assertions and
# overflow checks stay on. There is no workspace-wide opt-level 1.
[profile.dev.package.hirsel-intern]
opt-level = 1

# Compiler tools used by Buck2 tests. Keep the oracles'
# debug assertions and integer overflow checks while optimizing the compiler.
[profile.checked]
inherits = "release"
opt-level = 1
debug-assertions = true
overflow-checks = true

# Shipped/benchmarked compiler only; keep the developer release loop unchanged.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
