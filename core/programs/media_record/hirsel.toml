[package]
name = "media_record"
version = "1.0.0"
charge = "charge-v1"

[dependencies]
std = { major = 1 }
media_bits = { package = "media_bits", major = 1, path = "../media_bits" }
media_container = { package = "media_container", major = 1, path = "../media_container", authority = ["Dir"] }
rtp = { package = "rtp", major = 1, path = "../rtp" }
rtp_jitter = { package = "rtp_jitter", major = 1, path = "../rtp_jitter" }
webrtc_sfu = { package = "webrtc_sfu", major = 1, path = "../webrtc_sfu", authority = ["Net", "Clock", "Random", "Stdout", "Tasks", "Secret"] }

[sources]
"files.hirsel" = "files"
"record.hirsel" = "record"

[tests]
limit = 268435456

[tests.sources]
"laws.hirsel" = "laws"
"drive.hirsel" = "laws"
"frames.hirsel" = "laws"
