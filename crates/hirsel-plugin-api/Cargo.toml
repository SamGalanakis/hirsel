[package]
name = "hirsel-plugin-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The plugin contract deliberately depends on light, stable crates only. A
# plugin crate depends on this crate and nothing of hirsel's — the host depends
# on plugins (through the generated aggregator), so any edge back to
# `hirsel-host` would be a cycle.
[dependencies]
async-trait.workspace = true
axum = "0.7.9"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
