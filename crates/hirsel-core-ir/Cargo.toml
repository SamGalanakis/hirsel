[package]
name = "hirsel-core-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The structural well-formedness function, for tests of this crate and of its producers.
wf = []
# The FORM v0 test evaluator, for producers' behaviour cases.
eval = ["dep:hirsel-core-net", "dep:twox-hash", "dep:zeroize"]
map-observation = ["eval"]

[dependencies]
hirsel-core-net = { path = "../hirsel-core-net", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-layout = { path = "../hirsel-core-layout" }

zeroize = { version = "=1.9.2", optional = true }

twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"], optional = true }

[dev-dependencies]
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"] }
zeroize = "=1.9.2"
hirsel-core-net = { path = "../hirsel-core-net" }
hirsel-guard = { path = "../hirsel-guard" }
