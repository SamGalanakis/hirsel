[package]
name = "hirsel-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-mod = { path = "../hirsel-mod" }
libc = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

tempfile = "3"

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
