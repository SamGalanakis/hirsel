[package]
name = "hirsel-core-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[[example]]
name = "tape_cost"
required-features = ["record"]

[features]
# Only a standalone program owns the process allocator. Rust embeddings keep theirs.
standalone = []
record = ["dep:hirsel-tape-format"]
prof = []
testing = []
memcheck = []
charge-observation = []
allocation-count = []
mimalloc = ["dep:libmimalloc-sys"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hirsel_runtime_size)"] }

[dependencies]
foldhash = { version = "0.2.0", default-features = false }
hirsel-core-net = { path = "../hirsel-core-net" }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-stack = { path = "../hirsel-stack" }
libc = { version = "0.2", default-features = false }
libmimalloc-sys = { version = "=0.1.49", optional = true }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
zeroize = "=1.9.2"
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-tape-format = { path = "../hirsel-tape-format", optional = true }

twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_64"] }
io-uring = { version = "=0.7.16", default-features = false }

[dev-dependencies]
tempfile = "3"
hirsel-guard = { path = "../hirsel-guard" }
bumpalo = "=3.20.3"
mimalloc = { version = "=0.1.52", default-features = false }

