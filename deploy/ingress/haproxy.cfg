defaults
    timeout connect 5s
    timeout client 300000ms
    timeout server 300000ms

frontend tls_front
    mode tcp
    bind :443 ssl crt '/usr/local/etc/haproxy/certs'
    use_backend front_group_0 if { ssl_fc_sni -i -m str web.test }
    use_backend front_group_1 if { ssl_fc_sni -i -m str stream.test }
    default_backend front_default

backend front_default
    mode tcp
    tcp-request content reject

backend front_group_0
    mode http
    http-request set-header X-Forwarded-For %[src]
    server listener 127.0.0.1:18201

backend front_group_1
    mode tcp
    server listener 127.0.0.1:18202 send-proxy-v2
