[package]
name = "hirsel-core-front"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
cost-profile = []

[dependencies]
hashbrown = { version = "0.16.1", default-features = false }
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
hirsel-core-ids = { path = "../hirsel-core-ids" }
hirsel-core-ir = { path = "../hirsel-core-ir" }
hirsel-core-layout = { path = "../hirsel-core-layout" }
hirsel-core-syntax = { path = "../hirsel-core-syntax" }
hirsel-core-resolve = { path = "../hirsel-core-resolve" }

[dev-dependencies]
tempfile = "3"
hirsel-core-net = { path = "../hirsel-core-net" }
hirsel-core-ir = { path = "../hirsel-core-ir", features = ["eval", "wf"] }
hirsel-guard = { path = "../hirsel-guard" }
serde_json = "1"
