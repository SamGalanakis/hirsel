name: Darwin anti-rot
on:
  schedule:
    - cron: '15 4 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Darwin laws and native proof
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    outputs:
      setup: ${{ steps.setup.outcome }}
      laws: ${{ steps.laws.outcome }}
      failed-laws: ${{ steps.laws.outputs.failures }}
      proof: ${{ steps.proof.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the pinned native toolchain
        id: setup
        run: |
          rust=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust" --profile minimal --no-self-update
          cargo fetch --locked
          python3 tools/buck2/prepare.py --local
      - name: Darwin laws
        id: laws
        run: |
          buck=.buck2/bin/buck2
          targets=$("$buck" uquery 'kind("^_darwin_", root//:)')
          if [[ -z "$targets" ]]; then
            echo 'Buck found no Darwin laws' >&2
            exit 1
          fi
          failures=()
          while IFS= read -r target; do
            if ! "$buck" test -j4 "$target"; then
              failures+=("${target#root//:}")
            fi
          done <<< "$targets"
          printf 'failures=%s\n' "${failures[*]}" >> "$GITHUB_OUTPUT"
          ((${#failures[@]} == 0))
      - name: Native toolchain proof
        id: proof
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .buck2/bin/buck2 test -j4 //tools/buck2/native-toolchain:proof

  metadata:
    name: Apple metadata check
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Rust for the macOS and iOS targets
        run: |
          rust=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust" --profile minimal --no-self-update
          python3 tools/buck2/bootstrap_rust_toolchain.py
          python3 tools/apple_check.py

  corpus-toolchain:
    name: Build the Darwin corpus toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and install the compiler and Darwin runtime
        run: |
          rust=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust" --profile minimal --no-self-update
          cargo fetch --locked
          python3 tools/buck2/prepare.py --local

          driver=//:hirsel-core-driver-bin-hirsel
          runtime='//:hirsel-core-rt-archives[aarch64-apple-darwin]'
          kit=//tools/buck2/native-toolchain:kit
          outputs=$(.buck2/bin/buck2 build -j4 --show-json-output "$driver" "$runtime" "$kit")
          path_for() { jq -er --arg target "root$1" '.[$target]' <<< "$outputs"; }
          compiler=$(path_for "$driver")
          archive=$(path_for "$runtime")
          link_kit=$(path_for "$kit")
          prefix="$RUNNER_TEMP/darwin-corpus"
          "$compiler" core-product --install "$prefix" --runtime "$archive" \
            --target aarch64-apple-darwin --link-kit "$link_kit"
          tar -czf "$RUNNER_TEMP/darwin-corpus.tar.gz" -C "$prefix" .
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-corpus-toolchain
          path: ${{ runner.temp }}/darwin-corpus.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  corpus:
    name: Darwin corpus (${{ matrix.backend }}, ${{ matrix.packages }})
    needs: corpus-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: cranelift, packages: all}
          - {backend: llvm, packages: platform}
          - {backend: llvm, packages: runner}
          - {backend: llvm, packages: store}
          - {backend: llvm, packages: remaining}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: darwin-corpus-toolchain
          path: ${{ runner.temp }}
      - name: Cross-link and check Mach-O structure
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          HARVEST_GROUP: ${{ matrix.packages }}
        run: |
          prefix="$RUNNER_TEMP/darwin-corpus"
          mkdir "$prefix"
          tar -xzf "$RUNNER_TEMP/darwin-corpus.tar.gz" -C "$prefix"
          runtime=$("$prefix/hirsel" env --target aarch64-apple-darwin --json | jq -er '.runtime')
          only=()
          case "$HARVEST_GROUP" in
            all) ;;
            remaining)
              packages=$(PYTHONPATH=core/tools python3 -c '
          from m1 import DARWIN_HARVEST
          print(*[package for package in DARWIN_HARVEST if package not in {"platform", "runner", "store"}])')
              read -r -a only <<< "$packages"
              only=(--only "${only[@]}")
              ;;
            *) only=(--only "$HARVEST_GROUP") ;;
          esac
          python3 core/tools/m1.py --target aarch64-apple-darwin --backend "$BACKEND" \
            --compiler "$prefix/hirsel" --runtime "$runtime" "${only[@]}"

  report:
    name: File or update failure issues
    needs: [native, metadata, corpus-toolchain, corpus]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: hirsel-issue-reporter
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report failed checks
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RESULT: ${{ needs.native.result }}
          NATIVE_SETUP: ${{ needs.native.outputs.setup }}
          LAWS: ${{ needs.native.outputs.laws }}
          FAILED_LAWS: ${{ needs.native.outputs.failed-laws }}
          PROOF: ${{ needs.native.outputs.proof }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          CORPUS_TOOLCHAIN_RESULT: ${{ needs.corpus-toolchain.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
        run: |
          status=0
          report() {
            python3 tools/ci/report_failure.py "$@" || status=1
          }
          if [[ "$NATIVE_RESULT" == failure ]]; then
            if [[ "$NATIVE_SETUP" != success ]]; then
              report darwin-native-setup 'Preparing the native toolchain on Linux failed.'
            elif [[ "$LAWS" == failure && -n "$FAILED_LAWS" ]]; then
              read -r -a failures <<< "$FAILED_LAWS"
              for law in "${failures[@]}"; do
                report "$law" "Buck failed the target \`//:$law\` in the Darwin laws step."
              done
            elif [[ "$LAWS" != success ]]; then
              report darwin-laws 'The Darwin laws step failed before it returned individual results.'
            fi
            if [[ "$PROOF" == failure ]]; then
              report native-toolchain:proof 'The native toolchain proof failed on Linux.'
            fi
          fi
          if [[ "$METADATA_RESULT" == failure ]]; then
            report darwin-check 'The Apple metadata check job failed on Linux.'
          fi
          if [[ "$CORPUS_TOOLCHAIN_RESULT" == failure ]]; then
            report darwin-corpus-toolchain 'Building the toolchain for the Darwin corpus failed on Linux.'
          fi
          if [[ "$CORPUS_RESULT" == failure ]]; then
            report darwin-corpus-cross-link 'Cross-linking the Darwin corpus failed on Linux.'
          fi
          exit "$status"
