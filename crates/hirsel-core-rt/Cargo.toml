[package]
name = "hirsel-core-rt"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Only a standalone program owns the process allocator. Rust embeddings keep theirs.
standalone = []
testing = []
memcheck = []
charge-observation = []
mimalloc = ["dep:libmimalloc-sys"]

[dependencies]
hirsel-stack = { path = "../hirsel-stack" }
libc = { version = "0.2", default-features = false }
libmimalloc-sys = { version = "=0.1.49", optional = true }
hirsel-core-layout = { path = "../hirsel-core-layout" }

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
bumpalo = "=3.20.3"
mimalloc = { version = "=0.1.52", default-features = false }

