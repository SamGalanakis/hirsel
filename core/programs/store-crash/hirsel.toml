# The store's crash harnesses: programs the crash drivers (core/tools/store_crash_tests.py,
# store_journal_tests.py, runner_tests.py) build and kill at chosen points.
[package]
name = "hirsel.ai/store_crash"
version = "1.0.0"
charge = "charge-v1"

[dependencies]
std = { major = 1 }
store = { package = "store", major = 1, path = "../store", authority = ["Dir", "Clock", "Random", "Tasks"] }
runner = { package = "runner", major = 1, path = "../runner", authority = ["Dir", "Net", "Clock", "Random", "Stderr", "Process", "Tasks", "Args", "Secret", "Cred"] }
platform = { package = "platform", major = 1, path = "../platform", authority = ["Dir", "Net", "Clock", "Random", "Stdout", "Stderr", "Tasks", "Args", "Secret", "Cred"] }
jwtbind = { package = "hirsel.ai/jwtbind", major = 1, path = "../jwtbind", authority = ["Net", "Clock", "Random", "Tasks", "Secret"] }

[sources]
"platform_crash.hirsel" = "platform_crash"
"runner_crash.hirsel" = "runner_crash"
"runner_crash-bucket.hirsel" = "runner_crash"
"runner_crash-cold.hirsel" = "runner_crash"
"runner_crash-jwt.hirsel" = "runner_crash"
