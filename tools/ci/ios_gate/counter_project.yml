name: HirselCounterComparison
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  CounterGate:
    path: CounterGate
targets:
  EmbedCounter:
    type: application
    platform: iOS
    sources: [CounterHost.swift, Memory.h]
    dependencies:
      - package: CounterGate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.hirsel.simulator-counter-embed
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OBJC_BRIDGING_HEADER: Memory.h
schemes:
  EmbedCounter:
    build:
      targets:
        EmbedCounter: all
