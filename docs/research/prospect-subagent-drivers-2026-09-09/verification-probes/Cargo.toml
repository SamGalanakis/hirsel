[package]
name = "hirsel-drivers"
version = "0.1.0"
edition = "2024"
[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
futures-util = "0.3.31"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
[dev-dependencies]
tempfile = "3.23.0"
