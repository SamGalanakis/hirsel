[package]
name = "hirsel-prof"
description = "Portable CPU profiles for Hirsel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
addr2line = { version = "=0.26.1", default-features = false, features = ["std", "rustc-demangle"] }
gimli = { version = "=0.33.0", default-features = false, features = ["endian-reader", "std"] }
libc = { version = "0.2", default-features = false }
object = { version = "=0.40.0", default-features = false, features = ["elf", "macho", "read_core", "std"] }
sha2 = "0.10"
serde_json = "1"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "functions", "hooks"] }
tempfile = "3.27"

[dev-dependencies]
gimli = { version = "=0.33.0", default-features = false, features = ["write"] }
hirsel-guard = { path = "../hirsel-guard" }
